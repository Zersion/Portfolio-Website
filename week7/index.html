  <title>ml5 Doodle Recognition</title>
  <!-- 引入 p5.js 和 ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

</head>
<body>
    <header>
        <h1>Week 7: Recap</h1>
    </header>
  <h1>✏️ Doodle Recognition</h1>
  <p>Draw a simple doodle (like a cat, house, or apple) in the box below.</p>
  <p>Wait for the model to load, then click "Recognize" after you finish.</p>
  
  <div id="canvas-container"></div>
  
  <div style="display: flex; gap: 10px;">
    <button id="clearBtn">Clear Canvas</button>
    <button id="classifyBtn" disabled>Recognize Doodle</button>
  </div>

  <div id="result-container">
    <div id="status-msg">Loading model... please wait.</div>
  </div>
